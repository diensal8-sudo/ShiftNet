<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Sfondo Arrotondato -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)"/>
  
  <!-- Orologio / Quadrante Timbratrice -->
  <circle cx="256" cy="230" r="140" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="256" cy="230" r="115" fill="#0f172a" fill-opacity="0.6"/>
  
  <!-- Lancette Orologio (Ore 09:15) -->
  <line x1="256" y1="230" x2="256" y2="150" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="230" x2="320" y2="230" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="230" r="10" fill="#ffffff"/>

  <!-- Badge Simbolo Spunta / Presenza in basso -->
  <g transform="translate(186, 360)">
    <rect width="140" height="56" rx="28" fill="url(#accentGradient)" filter="url(#shadow)"/>
    <path d="M40 28 L58 44 L100 16" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

